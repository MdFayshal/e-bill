<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>বিদ্যুৎ বিল হিসাব ও বিল স্লিপ জেনারেটর</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        :root { --primary-color: #0f4c81; --accent-color: #0d6efd; --bg-light: #f3f4f6; }
        body { background-color: var(--bg-light); color: #1f2937; padding: 15px 10px; }

        #login-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(5px);
            display: flex; justify-content: center; align-items: center; z-index: 9999;
        }
        .login-card {
            background: #ffffff; padding: 30px 25px; border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 100%; max-width: 360px; text-align: center;
        }
        .login-card h2 { font-size: 20px; color: var(--primary-color); margin-bottom: 20px; border-bottom: 2px solid #e5e7eb; padding-bottom: 10px; }
        .login-field { margin-bottom: 15px; text-align: left; }
        .login-field label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 5px; color: #374151; }
        .login-field input { width: 100%; padding: 10px; border: 1.5px solid #d1d5db; border-radius: 6px; font-size: 14px; outline: none; }
        .login-field input:focus { border-color: var(--primary-color); }
        .btn-login { width: 100%; background: var(--primary-color); color: #fff; border: none; padding: 11px; font-size: 15px; font-weight: bold; border-radius: 6px; cursor: pointer; }
        .btn-login:hover { background: #0b3a63; }
        #login-error { color: #dc2626; font-size: 13px; font-weight: bold; margin-top: 12px; display: none; }
        #main-app-content { display: none; }

        input[type="number"]::-webkit-outer-spin-button, input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="number"] { -moz-appearance: textfield; }

        .controls-wrapper { max-width: 850px; margin: 0 auto 16px auto; background: #ffffff; padding: 16px 20px; border-radius: 10px; box-shadow: 0 4px 16px rgba(0,0,0,0.06); border: 1px solid #e5e7eb; }
        .controls-title { font-size: 20px; font-weight: 700; color: var(--primary-color); margin-bottom: 14px; text-align: center; border-bottom: 2px solid #e5e7eb; padding-bottom: 8px; }
        .global-inputs { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: center; margin-bottom: 12px; }
        .input-group-inline { display: flex; align-items: center; gap: 8px; }
        .input-group-inline label { font-weight: 600; font-size: 14px; color: #374151; }
        .input-group-inline input, .input-group-inline select { padding: 7px 12px; border: 1.5px solid #d1d5db; border-radius: 6px; font-size: 14px; outline: none; background: #fff; color: #111827; }
        .print-btn-container { text-align: center; margin-top: 8px; }
        .bottom-print-container { max-width: 850px; margin: 16px auto 10px auto; text-align: center; }
        .btn-print { background-color: var(--primary-color); color: white; border: none; padding: 9px 26px; font-size: 15px; font-weight: 600; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 10px rgba(15, 76, 129, 0.25); display: inline-flex; align-items: center; gap: 8px; }
        .slips-container { max-width: 850px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
        .bill-slip { background: #ffffff; border: 2px dashed #6b7280; border-radius: 8px; padding: 10px 14px; position: relative; box-shadow: 0 2px 6px rgba(0,0,0,0.04); }
        .slip-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #111827; padding-bottom: 5px; margin-bottom: 8px; }
        .slip-title-main { font-size: 15px; font-weight: 700; color: var(--primary-color); flex: 1; }
        .slip-location-title-centered { flex: 2; text-align: center; font-size: 19px; font-weight: 900; color: #0f172a; }
        .slip-meta-info { font-size: 13px; font-weight: 600; color: #4b5563; display: flex; gap: 12px; flex: 1.2; justify-content: flex-end; }
        .header-month-highlight { background: #dbeafe; color: #1e40af; padding: 1px 6px; border-radius: 4px; font-weight: 700; }
        .slip-body-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 8px; }
        .field-box { display: flex; flex-direction: column; gap: 4px; }
        .field-box label { font-size: 11.5px; font-weight: 700; color: #4b5563; }
        .field-box input { padding: 6px 8px; border: 1.5px solid #d1d5db; border-radius: 5px; font-size: 14px; outline: none; width: 100%; }
        .field-box input[readonly] { background-color: #f3f4f6; color: #111827; font-weight: 700; }
        .slip-footer-summary { display: flex; justify-content: space-between; align-items: center; background: #f8fafc; border: 1.5px solid #cbd5e1; padding: 6px 12px; border-radius: 6px; }
        .calc-breakdown { font-size: 13.5px; color: #334155; font-weight: 600; }
        .calc-month-tag { background: #f1f5f9; padding: 1px 5px; border-radius: 4px; border: 1px solid #cbd5e1; color: #0f172a; font-weight: 700; }
        .total-bill-display { display: flex; align-items: center; }
        .total-amount-highlight { font-size: 17px; font-weight: 900; color: #000; background: #fef08a; padding: 2px 10px; border-radius: 4px; border: 1px solid #eab308; }
        .sheet-config-row { display: none; }
        .connection-status { font-size: 12.5px; font-weight: 700; color: #6b7280; text-align: center; margin-top: 4px; }
        .connection-status.ok { color: #16a34a; }
        .connection-status.error { color: #dc2626; }
        .save-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px; margin-top: 6px; min-height: 14px; }
        .save-status { font-size: 12.5px; font-weight: 700; }
        .save-status.success { color: #16a34a; }
        .save-status.duplicate { color: #b45309; }
        .save-status.error { color: #dc2626; }
        .record-actions-row { display: none; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; margin-top: 6px; padding-top: 6px; border-top: 1px dashed #d1d5db; }
        .record-actions-row.visible { display: flex; }
        .record-loaded-note { font-size: 12px; font-weight: 700; color: #1e40af; width: 100%; text-align: center; margin-bottom: 2px; }
        .btn-mini { border: none; padding: 6px 14px; font-size: 12.5px; font-weight: 700; border-radius: 6px; cursor: pointer; }
        .btn-mini:disabled { background-color: #9ca3af !important; cursor: not-allowed; opacity: 0.7; }
        .btn-update { background-color: #0d6efd; color: #fff; }
        .btn-delete { background-color: #dc2626; color: #fff; }
        .btn-reset { background-color: #6b7280; color: #fff; }
        .confirm-overlay { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.55); z-index: 1000; align-items: center; justify-content: center; padding: 16px; }
        .confirm-overlay.open { display: flex; }
        .confirm-box { background: #fff; border-radius: 10px; max-width: 380px; width: 100%; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.25); text-align: center; }
        .confirm-box-title { font-size: 16px; font-weight: 800; color: #111827; margin-bottom: 8px; }
        .confirm-box-msg { font-size: 13.5px; color: #374151; margin-bottom: 16px; line-height: 1.5; }
        .confirm-box-actions { display: flex; gap: 10px; justify-content: center; }
        .confirm-box-actions .btn-mini { padding: 8px 20px; font-size: 13.5px; }
        .btn-confirm-ok { background-color: #16a34a; color: #fff; }
        .btn-confirm-cancel { background-color: #e5e7eb; color: #111827; }
        .save-all-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px; margin-top: 4px; }
        .btn-save-all { background-color: #16a34a; color: #fff; border: none; padding: 9px 22px; font-size: 14.5px; font-weight: 700; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 10px rgba(22, 163, 74, 0.25); }
        .btn-save-all:disabled { background-color: #9ca3af; cursor: not-allowed; box-shadow: none; }
        .save-all-status { font-size: 13px; font-weight: 700; color: #374151; }
        .save-all-status.success { color: #16a34a; }
        .save-all-status.duplicate { color: #b45309; }
        .save-all-status.error { color: #dc2626; }
        .print-val { display: none; font-weight: 700; font-size: 13px; }

        @media print {
            #login-overlay { display: none !important; }
            @page { size: A4 portrait; margin: 5mm 7mm; }
            html, body { background: #fff !important; padding: 0 !important; margin: 0 !important; width: 100%; height: 100%; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .controls-wrapper, .bottom-print-container, .btn-print, .save-row, .save-status, .sheet-config-row, .save-all-row, .connection-status, .record-actions-row, .confirm-overlay { display: none !important; }
            .slips-container { max-width: 100% !important; height: 285mm !important; display: flex !important; flex-direction: column !important; justify-content: space-between !important; gap: 0 !important; }
            .bill-slip.print-hide { display: none !important; }
            .bill-slip { box-shadow: none !important; border: 1.5px dashed #000 !important; border-radius: 0 !important; padding: 6px 10px !important; margin: 0 !important; page-break-inside: avoid !important; break-inside: avoid !important; background: #fff !important; flex: 1 1 auto !important; display: flex !important; flex-direction: column !important; justify-content: center !important; position: relative !important; }
            .bill-slip::after { content: '✂ ------------------------------------------------------------------------------------------------------'; position: absolute; bottom: -8px; left: 0; width: 100%; font-size: 8px; color: #4b5563; overflow: hidden; white-space: nowrap; display: block; z-index: 10; }
            .bill-slip:last-child::after { display: none; }
            .slip-header { border-bottom: 1.5px solid #000 !important; padding-bottom: 3px !important; margin-bottom: 5px !important; }
            .slip-title-main { font-size: 13px !important; color: #000 !important; font-weight: 800 !important; }
            .slip-location-title-centered { font-size: 17px !important; color: #000 !important; font-weight: 900 !important; }
            .slip-meta-info { font-size: 11px !important; color: #000 !important; gap: 8px !important; font-weight: 700 !important; }
            .header-month-highlight { background: #e2e8f0 !important; color: #000 !important; padding: 0px 4px !important; border: 1px solid #000 !important; }
            .slip-body-grid { grid-template-columns: repeat(4, 1fr) !important; gap: 8px !important; margin-bottom: 5px !important; }
            .field-box label { font-size: 10px !important; color: #111 !important; font-weight: 700 !important; }
            .field-box input { display: none !important; }
            .print-val { display: block !important; font-size: 12px !important; color: #000 !important; padding-top: 1px; font-weight: 800 !important; }
            .slip-footer-summary { background: #f8fafc !important; border: 1px solid #000 !important; padding: 4px 10px !important; border-radius: 3px !important; }
            .calc-breakdown { font-size: 11.5px !important; color: #000 !important; font-weight: 700 !important; }
            .calc-month-tag { background: #e2e8f0 !important; border: 1px solid #000 !important; padding: 0px 4px !important; }
            .total-amount-highlight { font-size: 14.5px !important; font-weight: 900 !important; color: #000 !important; background: #e2e8f0 !important; padding: 2px 10px !important; border: 1px solid #000 !important; }
        }
    </style>
</head>
<body>

    <!-- Login Screen -->
    <div id="login-overlay">
        <div class="login-card">
            <h2>বিদ্যুৎ বিল সিস্টেম লগইন</h2>
            <form onsubmit="handleLogin(event)">
                <div class="login-field">
                    <label for="username">ইউজারনেম (Username)</label>
                    <input type="text" id="username" placeholder="Username লিখুন" required autocomplete="username">
                </div>
                <div class="login-field">
                    <label for="password">পাসওয়ার্ড (Password)</label>
                    <input type="password" id="password" placeholder="Password লিখুন" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn-login">লগইন করুন</button>
            </form>
            <div id="login-error">ইউজারনেম অথবা পাসওয়ার্ড ভুল হয়েছে!</div>
        </div>
    </div>

    <!-- Main Content -->
    <div id="main-app-content">
        <div class="controls-wrapper">
            <div class="controls-title">বিদ্যুৎ বিল হিসাব ও প্রিন্ট কন্ট্রোল</div>
            <div class="global-inputs">
                <div class="input-group-inline">
                    <label for="global-date">তারিখ:</label>
                    <input type="text" id="global-date" value="" placeholder="DD-MM-YYYY">
                </div>
                <div class="input-group-inline">
                    <label for="global-month">বিলের মাস:</label>
                    <select id="global-month">
                        <option value="" selected disabled>মাস নির্বাচন করুন</option>
                        <option value="জানুয়ারি">জানুয়ারি</option>
                        <option value="ফেব্রুয়ারি">ফেব্রুয়ারি</option>
                        <option value="মার্চ">মার্চ</option>
                        <option value="এপ্রিল">এপ্রিল</option>
                        <option value="মে">মে</option>
                        <option value="জুন">জুন</option>
                        <option value="জুলাই">জুলাই</option>
                        <option value="আগস্ট">আগস্ট</option>
                        <option value="সেপ্টেম্বর">সেপ্টেম্বর</option>
                        <option value="অক্টোবর">অক্টোবর</option>
                        <option value="নভেম্বর">নভেম্বর</option>
                        <option value="ডিসেম্বর">ডিসেম্বর</option>
                    </select>
                    <select id="global-year">
                        <option value="" disabled>সাল নির্বাচন করুন</option>
                        <option value="২০২৬" selected>২০২৬</option>
                        <option value="২০২৭">২০২৭</option>
                        <option value="২০২৮">২০২৮</option>
                        <option value="২০২৯">২০২৯</option>
                        <option value="২০৩০">২০৩০</option>
                    </select>
                </div>
            </div>
            
            <div class="sheet-config-row">
                <input type="text" id="webapp-url">
            </div>
            
            <div class="save-all-row">
                <button class="btn-save-all" id="btn-save-all" onclick="saveAllSlips()">💾 সব বিল Google Sheet-এ সংরক্ষণ করুন</button>
                <span id="save-all-status" class="save-all-status"></span>
            </div>
            <div>
                <div id="connection-status" class="connection-status"></div>
            </div>
            <div class="print-btn-container">
                <button class="btn-print" onclick="window.print()">
                    <span>🖨️</span> Print A4 Page
                </button>
            </div>
        </div>

        <div class="slips-container" id="slips-container"></div>

        <div class="bottom-print-container">
            <button class="btn-print" onclick="window.print()">
                <span>🖨️</span> Print A4 Page
            </button>
        </div>
    </div>

    <!-- Confirm Modal -->
    <div class="confirm-overlay" id="confirm-overlay">
        <div class="confirm-box">
            <div class="confirm-box-title" id="confirm-box-title">নিশ্চিত করুন</div>
            <div class="confirm-box-msg" id="confirm-box-msg">আপনি কি নিশ্চিত?</div>
            <div class="confirm-box-actions">
                <button class="btn-mini btn-confirm-cancel" id="confirm-box-cancel">না, বাতিল করুন</button>
                <button class="btn-mini btn-confirm-ok" id="confirm-box-ok">হ্যাঁ, নিশ্চিত</button>
            </div>
        </div>
    </div>

    <script>
        /* =========================================================
           LOGIN SYSTEM CONFIGURATION (100% RELIABLE BASE64)
        ========================================================= */
        const AUTH_USER = "admin";
        const AUTH_PASS_ENCODED = "Njc5Ng=="; // Base64 encoding of "6796"

        function handleLogin(event) {
            event.preventDefault();
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value.trim();
            const err = document.getElementById('login-error');

            if (u === AUTH_USER && btoa(p) === AUTH_PASS_ENCODED) {
                document.getElementById('login-overlay').style.display = 'none';
                document.getElementById('main-app-content').style.display = 'block';
                err.style.display = 'none';
                
                setTodayDate();
                renderSlips();
                syncGlobalInfo();
                refreshSavedKeys();
                loadMonthData();
            } else {
                err.style.display = 'block';
            }
        }

        /* =========================================================
           Google Sheet Web App URL
        ========================================================= */
        const DEFAULT_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbwFAkZzgOWCzPYNIWEfVJvx-wd3bT3s0WcVwBd5u7kUYZrksu4q3DMxIfZgxbe1iwfh/exec";

        function setTodayDate() {
            const today = new Date();
            const dd = String(today.getDate()).padStart(2, '0');
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const yyyy = today.getFullYear();
            document.getElementById('global-date').value = `${dd}-${mm}-${yyyy}`;
        }

        const slipConfigs = [
            { name: "১ম তলা — দোকান আকাশ", defaultCost: 17, slug: "shop_akash" },
            { name: "১ম তলা — দোকান সাহালম", defaultCost: 17, slug: "shop_sahalam" },
            { name: "১ম তলা — দোকান হেদায়েতুল্লাহ", defaultCost: 17, slug: "shop_hedayetullah" },
            { name: "২য় তলা — উত্তর দিক", defaultCost: 11, slug: "floor2_north" },
            { name: "২য় তলা — দক্ষিণ দিক", defaultCost: 11, slug: "floor2_south" },
            { name: "৩য় তলা — উত্তর দিক", defaultCost: 11, slug: "floor3_north" },
            { name: "৩য় তলা — দক্ষিণ দিক", defaultCost: 11, slug: "floor3_south" }
        ];

        const slipsContainer = document.getElementById('slips-container');
        const globalDateInput = document.getElementById('global-date');
        const globalMonthSelect = document.getElementById('global-month');
        const globalYearSelect = document.getElementById('global-year');

        function toBanglaNumeral(numStr) {
            const banglaDigits = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
            return numStr.toString().replace(/\d/g, d => banglaDigits[d]);
        }

        function formatDecimalBangla(val) {
            if (val === null || val === undefined || isNaN(val)) return '০';
            let str = val.toString();
            let parts = str.split('.');
            let integerPart = toBanglaNumeral(parseFloat(parts[0]).toLocaleString('en-US'));
            if (parts.length > 1) {
                return integerPart + '.' + toBanglaNumeral(parts[1]);
            }
            return integerPart;
        }

        function getFullMonthText() {
            const month = globalMonthSelect.value || '';
            const year = globalYearSelect.value || '';
            if (!month && !year) return 'মাস ও সাল নির্বাচন করুন';
            if (!month) return `মাস নির্বাচন করুন ${year}`.trim();
            if (!year) return `${month} (সাল নির্বাচন করুন)`.trim();
            return `${month} ${year}`;
        }

        function renderSlips() {
            slipsContainer.innerHTML = '';
            slipConfigs.forEach((config, index) => {
                const slipDiv = document.createElement('div');
                slipDiv.className = 'bill-slip print-hide';
                slipDiv.id = `slip-${index}`;

                slipDiv.innerHTML = `
                    <div class="slip-header">
                        <span class="slip-title-main">বিদ্যুৎ বিল হিসাব</span>
                        <div class="slip-location-title-centered">${config.name}</div>
                        <div class="slip-meta-info">
                            <span>তারিখ: <span class="disp-date">${globalDateInput.value || '-'}</span></span>
                            <span>বিলের মাস: <span class="header-month-highlight disp-month">${getFullMonthText()}</span></span>
                        </div>
                    </div>
                    <div class="slip-body-grid">
                        <div class="field-box">
                            <label>বর্তমান মাসের ইউনিট</label>
                            <input type="number" step="any" class="curr-unit" placeholder="e.g. 350.5" oninput="calculateSlip(${index})">
                            <span class="print-val print-curr-val">-</span>
                        </div>
                        <div class="field-box">
                            <label>আগের মাসের ইউনিট</label>
                            <input type="number" step="any" class="prev-unit" placeholder="e.g. 250" oninput="calculateSlip(${index})">
                            <span class="print-val print-prev-val">-</span>
                        </div>
                        <div class="field-box">
                            <label>ব্যবহৃত ইউনিট</label>
                            <input type="number" step="any" class="used-unit" readonly value="0">
                            <span class="print-val print-used-val">০</span>
                        </div>
                        <div class="field-box">
                            <label>প্রতি ইউনিটের মূল্য (৳)</label>
                            <input type="number" step="any" class="unit-cost" value="${config.defaultCost}" oninput="calculateSlip(${index})">
                            <span class="print-val print-cost-val">৳${toBanglaNumeral(config.defaultCost)}</span>
                        </div>
                    </div>
                    <div class="slip-footer-summary">
                        <div class="calc-breakdown"><span class="calc-month-tag total-label-month">${getFullMonthText()}</span> মাসের হিসাব: <span class="calc-formula">০ × ৳${toBanglaNumeral(config.defaultCost)} = ৳০/=</span></div>
                        <div class="total-bill-display">
                            <span class="total-amount-highlight">মোট বিল <span class="total-val">৳০/=</span></span>
                        </div>
                    </div>
                    <div class="save-row">
                        <span class="save-status" id="save-status-${index}"></span>
                    </div>
                    <div class="record-actions-row" id="record-actions-${index}">
                        <span class="record-loaded-note">📌 এই মাসের ডেটা Sheet থেকে লোড হয়েছে — এডিট করে আপডেট/ডিলিট করুন</span>
                        <button class="btn-mini btn-update" onclick="confirmUpdateSlip(${index})">✏️ আপডেট করুন</button>
                        <button class="btn-mini btn-delete" onclick="confirmDeleteSlip(${index})">🗑️ ডিলিট করুন</button>
                        <button class="btn-mini btn-reset" onclick="resetSlip(${index})">🔄 রিসেট</button>
                    </div>
                `;
                slipsContainer.appendChild(slipDiv);
            });

            document.querySelectorAll('input[type="number"]').forEach(input => {
                input.addEventListener('wheel', function(e) { e.preventDefault(); }, { passive: false });
            });
        }

        function syncGlobalInfo() {
            const dateVal = globalDateInput.value || '-';
            const monthVal = getFullMonthText();

            document.querySelectorAll('.disp-date').forEach(el => el.textContent = dateVal);
            document.querySelectorAll('.disp-month').forEach(el => el.textContent = monthVal);
            document.querySelectorAll('.total-label-month').forEach(el => el.textContent = monthVal);
        }

        globalDateInput.addEventListener('input', syncGlobalInfo);
        globalMonthSelect.addEventListener('change', syncGlobalInfo);
        globalYearSelect.addEventListener('change', syncGlobalInfo);

        function calculateSlip(index) {
            const slip = document.getElementById(`slip-${index}`);
            
            const currInput = slip.querySelector('.curr-unit');
            const prevInput = slip.querySelector('.prev-unit');
            const costInput = slip.querySelector('.unit-cost');
            const usedInput = slip.querySelector('.used-unit');

            const currValStr = currInput.value.trim();
            const prevValStr = prevInput.value.trim();
            const costValStr = costInput.value.trim();

            if (currValStr === '') {
                slip.classList.add('print-hide');
            } else {
                slip.classList.remove('print-hide');
            }

            const curr = currValStr !== '' ? parseFloat(currValStr) : 0;
            const prev = prevValStr !== '' ? parseFloat(prevValStr) : 0;
            const cost = costValStr !== '' ? parseFloat(costValStr) : 0;

            let used = curr - prev;
            if (used < 0 || isNaN(used)) used = 0;

            used = Math.round(used * 100) / 100;
            usedInput.value = used;

            const totalBill = used * cost;
            const roundedTotal = Math.round(totalBill * 100) / 100;

            slip.querySelector('.print-curr-val').textContent = currValStr !== '' ? formatDecimalBangla(currValStr) : '-';
            slip.querySelector('.print-prev-val').textContent = prevValStr !== '' ? formatDecimalBangla(prevValStr) : '-';
            slip.querySelector('.print-used-val').textContent = formatDecimalBangla(used);
            slip.querySelector('.print-cost-val').textContent = '৳' + formatDecimalBangla(costValStr);

            const formattedTotal = formatDecimalBangla(roundedTotal);

            const formulaText = `${formatDecimalBangla(used)} × ৳${formatDecimalBangla(cost)} = ৳${formattedTotal}/=`;
            slip.querySelector('.calc-formula').textContent = formulaText;
            slip.querySelector('.total-val').textContent = '৳' + formattedTotal + '/=';
        }

        let WEB_APP_URL = DEFAULT_WEBAPP_URL;
        let savedKeysSet = new Set();
        let slipOriginalData = {};

        const webAppUrlInput = document.getElementById('webapp-url');
        const connectionStatusEl = document.getElementById('connection-status');

        if (webAppUrlInput) webAppUrlInput.value = WEB_APP_URL;

        const monthNumMap = {
            'জানুয়ারি': 1, 'ফেব্রুয়ারি': 2, 'মার্চ': 3, 'এপ্রিল': 4,
            'মে': 5, 'জুন': 6, 'জুলাই': 7, 'আগস্ট': 8,
            'সেপ্টেম্বর': 9, 'অক্টোবর': 10, 'নভেম্বর': 11, 'ডিসেম্বর': 12
        };

        function banglaToEnglishNumeral(str) {
            const banglaDigits = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
            return str.toString().split('').map(ch => {
                const idx = banglaDigits.indexOf(ch);
                return idx !== -1 ? idx : ch;
            }).join('');
        }

        function buildBillKey(index) {
            const config = slipConfigs[index];
            const monthBn = globalMonthSelect.value;
            const yearBn = globalYearSelect.value;
            if (!config || !monthBn || !yearBn) return null;
            const monthNum = monthNumMap[monthBn];
            const yearNum = banglaToEnglishNumeral(yearBn);
            if (!monthNum || !yearNum) return null;
            return `${config.slug}_${yearNum}_${monthNum}`;
        }

        const confirmOverlay = document.getElementById('confirm-overlay');
        const confirmBoxTitle = document.getElementById('confirm-box-title');
        const confirmBoxMsg = document.getElementById('confirm-box-msg');
        const confirmBoxOk = document.getElementById('confirm-box-ok');
        const confirmBoxCancel = document.getElementById('confirm-box-cancel');
        let pendingConfirmAction = null;

        function showConfirm(title, msg, onOk) {
            confirmBoxTitle.textContent = title;
            confirmBoxMsg.textContent = msg;
            pendingConfirmAction = onOk;
            confirmOverlay.classList.add('open');
        }

        function hideConfirm() {
            confirmOverlay.classList.remove('open');
            pendingConfirmAction = null;
        }

        confirmBoxCancel.addEventListener('click', hideConfirm);
        confirmOverlay.addEventListener('click', (e) => { if (e.target === confirmOverlay) hideConfirm(); });
        confirmBoxOk.addEventListener('click', () => {
            const action = pendingConfirmAction;
            hideConfirm();
            if (typeof action === 'function') action();
        });

        async function refreshSavedKeys() {
            if (!WEB_APP_URL || WEB_APP_URL.includes("YOUR_SCRIPT_ID_HERE")) {
                connectionStatusEl.textContent = '⚠️ Google Sheet Web App URL কনফিগার করা হয়নি।';
                connectionStatusEl.className = 'connection-status error';
                updateAllSaveButtonsState();
                return;
            }
            connectionStatusEl.textContent = '🔄 যাচাই করা হচ্ছে...';
            connectionStatusEl.className = 'connection-status';
            try {
                const res = await fetch(WEB_APP_URL + '?action=list');
                const data = await res.json();
                if (data.status === 'success') {
                    savedKeysSet = new Set(data.keys || []);
                    connectionStatusEl.textContent = `✅ গুগল শিটের সাথে সংযুক্ত আছে (${toBanglaNumeral(savedKeysSet.size)}টি বিল সংরক্ষিত আছে)`;
                    connectionStatusEl.className = 'connection-status ok';
                } else {
                    connectionStatusEl.textContent = '❌ গুগল শিটের সাথে সংযোগ ব্যর্থ হয়েছে';
                    connectionStatusEl.className = 'connection-status error';
                }
            } catch (err) {
                connectionStatusEl.textContent = '❌ সংযোগ ব্যর্থ (URL ভুল বা সংযোগ সমস্যা)';
                connectionStatusEl.className = 'connection-status error';
            }
            updateAllSaveButtonsState();
            loadMonthData();
        }

        async function loadMonthData() {
            const monthBn = globalMonthSelect.value;
            const yearBn = globalYearSelect.value;

            slipOriginalData = {};
            slipConfigs.forEach((cfg, idx) => toggleRecordActions(idx, false));

            if (!WEB_APP_URL || WEB_APP_URL.includes("YOUR_SCRIPT_ID_HERE") || !monthBn || !yearBn) return;

            const monthNum = monthNumMap[monthBn];
            const yearNum = banglaToEnglishNumeral(yearBn);
            if (!monthNum || !yearNum) return;

            try {
                const res = await fetch(`${WEB_APP_URL}?action=getMonth&yearNum=${encodeURIComponent(yearNum)}&monthNum=${encodeURIComponent(monthNum)}`);
                const data = await res.json();
                if (data.status !== 'success') return;

                const recordsByKey = {};
                (data.records || []).forEach(rec => { recordsByKey[rec.key] = rec; });

                slipConfigs.forEach((cfg, idx) => {
                    const key = buildBillKey(idx);
                    const rec = key ? recordsByKey[key] : null;
                    if (rec) {
                        applyRecordToSlip(idx, rec);
                        slipOriginalData[idx] = rec;
                        toggleRecordActions(idx, true);
                    }
                });
            } catch (err) {}
        }

        function applyRecordToSlip(index, rec) {
            const slip = document.getElementById(`slip-${index}`);
            if (!slip) return;
            slip.querySelector('.curr-unit').value = rec.currUnit || '';
            slip.querySelector('.prev-unit').value = rec.prevUnit || '';
            slip.querySelector('.unit-cost').value = rec.unitCost || slipConfigs[index].defaultCost;
            calculateSlip(index);
        }

        function toggleRecordActions(index, visible) {
            const row = document.getElementById(`record-actions-${index}`);
            if (row) row.classList.toggle('visible', !!visible);
        }

        function resetSlip(index) {
            const rec = slipOriginalData[index];
            if (!rec) return;
            applyRecordToSlip(index, rec);
            const statusEl = document.getElementById(`save-status-${index}`);
            if (statusEl) {
                statusEl.textContent = '';
                statusEl.className = 'save-status';
            }
        }

        function confirmUpdateSlip(index) {
            const config = slipConfigs[index];
            showConfirm(
                'আপডেট নিশ্চিত করুন',
                `আপনি কি "${config.name}"-এর এই মাসের ডেটা আপডেট করতে চান?`,
                () => updateSlip(index)
            );
        }

        function confirmDeleteSlip(index) {
            const config = slipConfigs[index];
            showConfirm(
                'ডিলিট নিশ্চিত করুন',
                `আপনি কি "${config.name}"-এর এই মাসের ডেটা Google Sheet থেকে মুছে ফেলতে চান?`,
                () => deleteSlip(index)
            );
        }

        async function updateSlip(index) {
            if (!WEB_APP_URL || WEB_APP_URL.includes("YOUR_SCRIPT_ID_HERE")) return;
            const key = buildBillKey(index);
            const statusEl = document.getElementById(`save-status-${index}`);
            if (!key || !slipOriginalData[index]) return;

            const slip = document.getElementById(`slip-${index}`);
            const currVal = slip.querySelector('.curr-unit').value.trim();
            if (currVal === '') return;

            const prevVal = slip.querySelector('.prev-unit').value.trim();
            const costVal = slip.querySelector('.unit-cost').value.trim();
            const usedVal = slip.querySelector('.used-unit').value;
            const totalText = slip.querySelector('.total-val').textContent;

            const payload = {
                action: 'update',
                key: key,
                shop: slipConfigs[index].name,
                month: globalMonthSelect.value,
                year: globalYearSelect.value,
                monthNum: monthNumMap[globalMonthSelect.value],
                yearNum: banglaToEnglishNumeral(globalYearSelect.value),
                date: globalDateInput.value,
                currUnit: currVal,
                prevUnit: prevVal || '0',
                usedUnit: usedVal,
                unitCost: costVal,
                totalBill: totalText
            };

            if (statusEl) {
                statusEl.textContent = '⏳ আপডেট হচ্ছে...';
                statusEl.className = 'save-status';
            }

            try {
                const res = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (data.status === 'success') {
                    slipOriginalData[index] = payload;
                    if (statusEl) {
                        statusEl.textContent = '✅ সফলভাবে আপডেট হয়েছে।';
                        statusEl.className = 'save-status success';
                    }
                }
            } catch (err) {
                if (statusEl) {
                    statusEl.textContent = '❌ সংযোগ ব্যর্থ হয়েছে।';
                    statusEl.className = 'save-status error';
                }
            }
        }

        async function deleteSlip(index) {
            if (!WEB_APP_URL || WEB_APP_URL.includes("YOUR_SCRIPT_ID_HERE")) return;
            const key = buildBillKey(index);
            const statusEl = document.getElementById(`save-status-${index}`);
            if (!key || !slipOriginalData[index]) return;

            if (statusEl) {
                statusEl.textContent = '⏳ ডিলিট হচ্ছে...';
                statusEl.className = 'save-status';
            }

            try {
                const res = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'delete', key: key })
                });
                const data = await res.json();
                if (data.status === 'success') {
                    delete slipOriginalData[index];
                    savedKeysSet.delete(key);
                    toggleRecordActions(index, false);

                    const slip = document.getElementById(`slip-${index}`);
                    slip.querySelector('.curr-unit').value = '';
                    slip.querySelector('.prev-unit').value = '';
                    slip.querySelector('.unit-cost').value = slipConfigs[index].defaultCost;
                    calculateSlip(index);

                    if (statusEl) {
                        statusEl.textContent = '✅ সফলভাবে ডিলিট হয়েছে।';
                        statusEl.className = 'save-status success';
                    }
                }
            } catch (err) {
                if (statusEl) {
                    statusEl.textContent = '❌ সংযোগ ব্যর্থ হয়েছে।';
                    statusEl.className = 'save-status error';
                }
            }
        }

        function updateAllSaveButtonsState() {
            slipConfigs.forEach((config, index) => updateSlipStatusDisplay(index));
        }

        function updateSlipStatusDisplay(index) {
            const statusEl = document.getElementById(`save-status-${index}`);
            if (!statusEl) return;
            const key = buildBillKey(index);

            if (key && savedKeysSet.has(key)) {
                statusEl.textContent = '✅ এই মাসের বিল সংগৃহীত আছে';
                statusEl.className = 'save-status duplicate';
            } else if (statusEl.className.indexOf('success') === -1) {
                statusEl.textContent = '';
                statusEl.className = 'save-status';
            }
        }

        async function saveAllSlips() {
            if (!WEB_APP_URL || WEB_APP_URL.includes("YOUR_SCRIPT_ID_HERE")) {
                alert('Google Sheet Web App URL কনফিগার করা হয়নি।');
                return;
            }
            if (!globalMonthSelect.value || !globalYearSelect.value) {
                alert('অনুগ্রহ করে বিলের মাস ও সাল নির্বাচন করুন।');
                return;
            }

            const saveAllBtn = document.getElementById('btn-save-all');
            const saveAllStatusEl = document.getElementById('save-all-status');
            saveAllBtn.disabled = true;
            saveAllBtn.textContent = '⏳ সংরক্ষণ হচ্ছে...';

            let savedCount = 0;
            let duplicateCount = 0;

            for (let index = 0; index < slipConfigs.length; index++) {
                const slip = document.getElementById(`slip-${index}`);
                const statusEl = document.getElementById(`save-status-${index}`);
                const currVal = slip.querySelector('.curr-unit').value.trim();

                if (currVal === '') continue;

                const key = buildBillKey(index);
                if (!key || savedKeysSet.has(key)) {
                    duplicateCount++;
                    continue;
                }

                const prevVal = slip.querySelector('.prev-unit').value.trim();
                const costVal = slip.querySelector('.unit-cost').value.trim();
                const usedVal = slip.querySelector('.used-unit').value;
                const totalText = slip.querySelector('.total-val').textContent;

                const payload = {
                    key: key,
                    shop: slipConfigs[index].name,
                    month: globalMonthSelect.value,
                    year: globalYearSelect.value,
                    monthNum: monthNumMap[globalMonthSelect.value],
                    yearNum: banglaToEnglishNumeral(globalYearSelect.value),
                    date: globalDateInput.value,
                    currUnit: currVal,
                    prevUnit: prevVal || '0',
                    usedUnit: usedVal,
                    unitCost: costVal,
                    totalBill: totalText
                };

                try {
                    const res = await fetch(WEB_APP_URL, {
                        method: 'POST',
                        body: JSON.stringify(payload)
                    });
                    const data = await res.json();
                    if (data.status === 'success') {
                        savedKeysSet.add(key);
                        savedCount++;
                        if (statusEl) {
                            statusEl.textContent = '✅ সফলভাবে সংরক্ষিত হয়েছে।';
                            statusEl.className = 'save-status success';
                        }
                    }
                } catch (err) {}
            }

            saveAllBtn.disabled = false;
            saveAllBtn.textContent = '💾 সব বিল Google Sheet-এ সংরক্ষণ করুন';
            
            if (savedCount > 0) loadMonthData();
        }

        globalMonthSelect.addEventListener('change', () => { updateAllSaveButtonsState(); loadMonthData(); });
        globalYearSelect.addEventListener('change', () => { updateAllSaveButtonsState(); loadMonthData(); });
    </script>
</body>
</html>
